---
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-source
  namespace: sparse
  labels:
    app: cifar10-source
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: sparse/node
                operator: In
                values:
                - aio
              - key: kubernetes.io/arch
                operator: In
                values:
                - "amd64"
      containers:
      - name: cifar10-source
        image: anterondocker/sparse-framework:pytorch
        imagePullPolicy: IfNotPresent
        workingDir: /app
        env:
        - name: SPARSE_API_HOST
          value: "sparse-edge"
        command: ["python3", "cifar10source.py"]
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: sparse-code
          mountPath: /usr/lib/sparse_framework
        - name: sparse-data
          mountPath: /data
      restartPolicy: Never
      volumes:
      - name: app-code
        hostPath:
          path: /opt/stream-pace-steering
      - name: sparse-code
        hostPath:
          path: /opt/sparse/sparse_framework
      - name: sparse-data
        hostPath:
          path: /var/lib/sparse
