---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar10-label-logger
  namespace: sparse
  labels:
    app: cifar10-label-logger
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: cifar10-label-logger
  template:
    metadata:
      labels:
        app: cifar10-label-logger
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: sparse/node
                operator: In
                values:
                - aio
              - key: kubernetes.io/arch
                operator: In
                values:
                - "amd64"
      containers:
      - name: cifar10-label-logger
        image: anterondocker/sparse-framework:pytorch
        imagePullPolicy: IfNotPresent
        workingDir: /app
        env:
        - name: SPARSE_API_HOST
          value: "sparse-root"
        command: ["python3", "cifar10labellogger.py"]
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: sparse-code
          mountPath: /usr/lib/sparse_framework
        - name: sparse-data
          mountPath: /data
      volumes:
      - name: app-code
        hostPath:
          path: /opt/stream-pace-steering
      - name: sparse-code
        hostPath:
          path: /opt/sparse/sparse_framework
      - name: sparse-data
        hostPath:
          path: /var/lib/sparse
